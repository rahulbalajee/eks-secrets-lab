# Values Terraform produced (queue URL, bucket name), published to Parameter Store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transcoder-infra
  namespace: video
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: transcoder-infra
  data:
    - secretKey: QUEUE_URL
      remoteRef:
        key: /video-pipeline/prod/transcode-queue-url
    - secretKey: OUTPUT_BUCKET
      remoteRef:
        key: /video-pipeline/prod/output-bucket
---
# The database password, from a JSON secret in Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transcoder-secrets
  namespace: video
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: transcoder-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: video-pipeline/prod/db
        property: password
