# moto: an in-memory fake of the AWS APIs (SSM, Secrets Manager, SQS, STS).
apiVersion: v1
kind: Namespace
metadata:
  name: fake-aws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: fake-aws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moto
  template:
    metadata:
      labels:
        app: moto
    spec:
      # A Service named "moto" makes Kubernetes inject MOTO_PORT=tcp://...,
      # which moto reads as its own port setting. Service links off.
      enableServiceLinks: false
      containers:
        - name: moto
          image: motoserver/moto:MOTO_VERSION
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /moto-api/
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: fake-aws
spec:
  selector:
    app: moto
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: moto-host
  namespace: fake-aws
spec:
  type: NodePort
  selector:
    app: moto
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
